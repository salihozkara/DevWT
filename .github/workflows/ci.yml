name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dotnet:
    name: .NET build and test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Devwt.slnx

      - name: Build
        run: dotnet build Devwt.slnx --no-restore -warnaserror

      - name: Format
        run: dotnet format Devwt.slnx --verify-no-changes --no-restore

      - name: Test
        run: dotnet test Devwt.slnx --no-build
